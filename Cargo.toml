[package]
name = "hfcast"
version = "1.2.0"
edition = "2021"
rust-version = "1.87"
description = "HF radio propagation prediction: a Rust port of VOACAP, verified cell by cell against the Fortran"
license = "Apache-2.0"
repository = "https://github.com/isopod/hfcast-engine"
readme = "README.md"
keywords = ["radio", "propagation", "voacap", "ionosphere", "hf"]
categories = ["science", "simulation"]

# The ionospheric coefficients are not in the published package. Part of
# that data comes from CCIR Reports 322 and 340 rather than from NTIA/ITS
# — see NOTICE and docs/licence.md. Everything NTIA/ITS wrote is a work of
# the US Government and ships.
#
# A build from a source checkout can compile them in with the
# `embedded-coefficients` feature. A build without them reads them from a
# real `itshfbc` root, which is how the reference engine has always found
# them.
exclude = [
  "embedded/coeffs/**",
  "docs/**",
  "tools/**",
  "tests/**",
  "trace/**",
  "soak-paths.tsv",

  # Repository plumbing. None of it does anything in a dependency, and
  # what ships is what obliges a version bump — see
  # `tools/check-version-bump.sh`, which reads this boundary from
  # `cargo package --list`.
  ".github/**",
  ".githooks/**",
  ".gitignore",
  ".git-blame-ignore-revs",
  "AGENTS.md",
  "CLAUDE.md",

  # Cargo finds a binary for every file in `src/bin/`, so all 22 of them
  # would ship and `cargo install hfcast` would build and install all 22.
  # Only `predict` is of any use to somebody who depends on this crate.
  "src/bin/antcheck.rs",
  "src/bin/archcheck.rs",
  "src/bin/areacheck.rs",
  "src/bin/calibrate.rs",
  "src/bin/complexity.rs",
  "src/bin/correctcheck.rs",
  "src/bin/daily.rs",
  "src/bin/engines.rs",
  "src/bin/fuzz.rs",
  "src/bin/irtam_validate.rs",
  "src/bin/lufcheck.rs",
  "src/bin/measure.rs",
  "src/bin/mufcheck.rs",
  "src/bin/paritycheck.rs",
  "src/bin/portcheck.rs",
  "src/bin/porttest.rs",
  "src/bin/reliability.rs",
  "src/bin/spacewx.rs",
  "src/bin/storm.rs",
  "src/bin/threadscale.rs",
  "src/bin/validate.rs",
]

[features]
default = []

# Compiles the 544 KB of ionospheric coefficients into the binary, so a
# prediction needs no `itshfbc` tree on disk. Only available when building
# from the repository: the files are not in the published package. See the
# note above.
#
# This does not cover the URSI-88 foF2 maps, which are in no build at all.
# A `COEFFS URSI88` card needs a real `itshfbc` root.
embedded-coefficients = []

# No dependencies on purpose. The harness is the reference against which a port
# is judged, so its own supply chain is kept empty: everything here is std.
#
# `build.rs` has no dependencies either. It exists only to explain one
# failure that would otherwise be a bare "file not found" — see the file.

# `measure` had a `[[bin]]` section here naming the default path, which
# Cargo finds by itself. It is gone because `src/bin/measure.rs` is now
# excluded from the package, and a section naming a file the package does
# not carry would fail the packaged build. `cargo run --bin measure`
# still works in a source checkout.

[profile.release]
debug = true
