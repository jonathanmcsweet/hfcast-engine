[package]
name = "hfcast"
version = "0.51.1"
edition = "2021"
description = "HF propagation engine: a Rust port of VOACAP, and the harness that verifies it"
license = "Apache-2.0"
# Publishing waits on the coefficient-file decision in docs/licence.md.
publish = false

# No dependencies on purpose. The harness is the reference against which a port
# is judged, so its own supply chain is kept empty: everything here is std.

[[bin]]
name = "measure"
path = "src/bin/measure.rs"

[profile.release]
debug = true
